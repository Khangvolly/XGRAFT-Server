# UPDATE 7/28/2022
# This plugin was already discontinued last December 16 2021
# Since a lot of people are still playing with this version
# I removed the update checker. Anyways, thanks for playing!
#
# [PRICE LIST]
#
# Setting Value to 0 will disable the enchantment
# You can also rename the enchantment name, leaving it blank will be default
#
# LANGUAGE SUPPORT IMPLEMENTED
#
# ENG - ENGLISH
# CTM - Configurable Language [English]
#
LANGUAGE: CTM
#
# [CUSTOM MODEL DATA ON BOOKS]
ArmorBooks: 1
WeaponBooks: 2
ToolBooks: 3
GrimoireBooks: 4
#
# [Player Glow]
# If player is hold/equip weapon/armor/tools with enchantment
# Better remain false if your server has a lot of plugins
# that might conflict with glow effect
GLOW: false
#
# [ENCHANTMENT LIMIT]
# Default 8
EnchantLimit: 8
# Allow Custom Enchant to obtain in Enchantment Table
# Custom Enchants with '0' price will not be added
# Note: You will only get Level 1 custom enchants from Enchantment table
AllowEnchantmentTable: true
AllowAnvilUpgrades: false
# Note that the higher enchantment cost, the higher
# chance for the FirstCEChance to be selected
# First Chance probability(Second Probability will not happen if first probability fails)
FirstCEChance: 0.5
SecondCEChance: 0.15
# Custom Loots, you can acquire custom enchants
# loots in treasure chests or chests from villages
AllowCustomLoot: true
#
# [PERMISSION]
# Who can use /enchantshop command
# [EVERYONE | ADMIN]
ENCHANT_SHOP: EVERYONE
# If there is an economy plugin installed
# Who can buy levels and boss from the shop
BUY_LEVELS_SHOP: EVERYONE
BUY_BOSS_SHOP: EVERYONE
#
ABSORB: 60
