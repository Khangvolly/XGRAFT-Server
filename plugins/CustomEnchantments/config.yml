#
# [TREASURE]
# This field will be treasure chances [Lucky Treasure Enchantment]
# value's are in decimal places
# and it should range between 
# [ 1.0 to 0.0 ] where 1.0 is the highest
TREASURES: 0.005
PHOENIX******: 0.005
GRIMOIRE******: 0.005
#
# [Allow Phoenix]
# Disabling phoenix will deny players from
# using the item, and also by getting the item
# through lucky treasures
AllowPhoenix: true
#
# [Stella]
# Disabling this will deny players on using bows
# With stella enchantment
# Players can only obtain stella through killing the
# Creeper boss and witch
# [Note that stella is random, almost impossible to
# obtain since it is very OP]
#
AllowStella: true
StellaDropChance: 0.001
#
# [WEAPON CHANCES]
# This field will be the weapon trigger chances
# the value ranges should be the same as [ 1.0 to 0.0 ]
LIGHTSPIRIT_CHANCE: 0.3
BLEED_CHANCE: 0.2
COBWEB_CHANCE: 0.3
FREEZE_CHANCE: 0.05
#
# [SPELL COOL DOWNS]
#
GRIMOIRE_STAFF: 30
#
GRIMOIRE: 120
SUPPORT_GRIMOIRE: 130
#
STORM_COOLDOWN: 5
ALLOW_STORM: true
PHOENIX_COOLDOWN: 600
STELLA_COOLDOWN: 1800
#
#
# [Chunk enchantment]
# This will be the size of chunk that the player had
# mined, 1 = 3x3x3, 2 = 5x5x5, 3 = 7x7x7 and so on..
# The value for chunk cool down will be in seconds
CHUNK1: 1
CHUNK1_CD: 120
#
CHUNK2: 2
CHUNK2_CD: 360
#
CHUNK3: 3
CHUNK3_CD: 900
#
CHUNK4: 4
CHUNK4_CD: 1800
#
# Light Spirit Damage multiplier
# Damage + (Damage * Multiplier) = Final Damage
LS_1: 1.45
LS_2: 2.1
LS_3: 2.8
LS_4: 3.0
LS_5: 3.5
# Grappling hook cooldown in Seconds
GRAPPLING_HOOK_CD: 0.5
#
# [Death Head]
# When a player dies, instead of dropping
# items on the ground, it will spawn a head
# at the death location. Breaking the head
# will drop all the items that the player has
# (Sometimes buggy tho)
ToggleDeathHead: false
# Hostile Mobs damage Negate (Increasing Hostile Mobs damage Resistance)
HostileMobsDmgNegate: 0.2
# ----------------------------------------------------------------
# [Experimental]
# Note: You have to restart the server if you modified this section
#       `/ce reload` only works on setting the Enchantment Prices
#
# TnT/Creeper explosion animation
explosion_animation: true
#
death_angel_explosion: false
# Join and Leave message on chat
# +JayMar921
# -JayMar921
join_leave_message: true
#
# [This feature only works on 1.17 and above]
DisableFrozenTree: true
DisableEnchantedTree: true
DisableCustomRecipes: false
#
# [ANTI DUPE]
# Check players inventory, if 2 items found with same
# data, the copies will be deleted
#
# Only works on Items with Enchantments [Books, Armors, Weapons, Shields, Tools]
#
# NOTE: This feature does not support items from 2.1.2e and below
#       therefore if AntiDupe checks same item in inventories the copies
#       will be auto removed. Make sure to back up your server.
#       *The Developers are not responsible for this issue*
# Logs in console will display the player and the item/s(with custom name) removed
AntiDupe: true
# [Allow custom Item Status?]
# when you craft an item ex. Sword, it will have sword status
CustomItemStatus: true
createStatusLore: true
# Allow particle effects while riding a horse?
horseParticle: false
# Enable WorldGuard
WorldGuard: false
# Enchantments Particle
# If you are running on low end server, I recommend
# to set 'EnableParticles' to false
# There are still some enchantments that will have particles enabled
# but majority will be affected if disabled.
EnableParticles: true
# Enable 'Enchantments:' lore everytime you apply enchantments
EnableEnchantmentsLore: true
